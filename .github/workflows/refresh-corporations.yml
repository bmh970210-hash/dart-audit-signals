name: Refresh DART company registry
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and parse OpenDART company registry
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          test -n "$DART_API_KEY" || { echo "Set repository secret DART_API_KEY"; exit 1; }
          python scripts/refresh_corp_registry.py
      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corporations.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh DART company registry"
            git push
          fi
